  <li>Para construir, elige el edificio, toca el lugar y pulsa <b>Construir</b>. Muros y caminos se trazan arrastrando.</li>
  <li>Mantén pulsado un botón del panel para ver qué hace. Botones rápidos: <b>✕</b> deseleccionar, <b>Ejército</b> y <b>Inactivo</b>. Juega mejor con el teléfono en horizontal.</li></ul>
  <h3>Economía</h3><p>Recursos: comida, madera, oro, piedra y hierro. Los aldeanos los llevan al centro urbano o a un acopio (molino, aserradero, campamento minero). Construye casas para aumentar la población. Las granjas dan comida renovable y se resiembran solas con 60 de madera. Los caminos aceleran el movimiento.</p>
  <h3>Eras</h3><p>Avanza en el centro urbano. Necesitas dos edificios de la era actual. La Era del Reino desbloquea tiradores, caballería, templo, herrería, mercado, torres y muros; la Era del Imperio, el asedio, el castillo y tu general.</p>
  <h3>Experiencia y niveles</h3><p>Las unidades militares acumulan experiencia pendiente al dañar y derrotar enemigos. Solo la ganan si <b>sobreviven al enfrentamiento</b> (5 segundos sin combatir). Subir es progresivo: nivel 2 con 100 XP, 3 con 260, 4 con 480 y 5 con 800. Cada nivel da +10% de vida y +8% de ataque; desde el nivel 3, +1 de armadura, y desde el 4 regeneran vida. La insignia sobre la cabeza indica el nivel.</p>
  <h3>Generales</h3><p>Cada raza tiene un general único que se entrena en el castillo. Solo puede existir uno a la vez. Tiene un aura que refuerza a los aliados cercanos y una habilidad especial que lanza solo en combate.</p>
  <h3>Mundo</h3><p>Bandidos y goblins atacan desde sus campamentos: destrúyelos para obtener botín. Hay cofres, reliquias (oro constante) y un santuario custodiado por un ogro. El clima cambia (lluvia, niebla, nieve, tormentas) y pueden ocurrir incendios, terremotos y plagas.</p>
  <h3>Diplomacia</h3><p>Desde la barra superior puedes aliarte, firmar la paz, declarar la guerra o enviar tributos. Ganas cuando todos los reinos que quedan son tus aliados.</p></div><div class="mrow"><button data-close>Cerrar</button></div>`)}function nn(e){if(q.over)return;q.over=!0;let t=q.players.map(e=>`<tr><td><i class="sw" style="background:${r.TEAM_COLORS[e.color].hex}"></i> ${gt(e.name)}</td><td>${b[e.race].n}</td><td>${e.alive?`En pie`:`Derrotado`}</td><td>${e.stats.trained}</td><td>${e.stats.killed}</td><td>${e.stats.lost}</td><td>${e.stats.razed}</td><td>${Math.round(Object.values(e.stats.gathered).reduce((e,t)=>e+t,0))}</td><td>${e.stats.maxLevel}</td></tr>`).join(``);setTimeout(()=>{W.paused=!0,Qt(`<h2 class="${e?`win`:`lose`}">${e?`¡Victoria!`:`Derrota`}</h2><p class="lead">${e?`Tu imperio domina estas tierras.`:`Tu reino ha caído, pero la historia aún puede reescribirse.`} Duración: ${Math.floor(q.time/60)} min.</p>

<body>
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div id="top" class="panel">
    <div id="resbar"></div>
    <div class="tinfo"><span id="age"></span><span id="clock">00:00</span><span id="weather"></span></div>
    <div class="tbtns"><button id="b-idle" data-tip="Aldeanos inactivos (tecla .)">Inactivos: 0</button><button id="b-diplo">Diplomacia</button><button id="b-music">Música</button><button id="b-speed">1x</button><button id="b-menu">Menú</button></div>
  </div>
  <div id="log"></div>
  <div id="proposals"></div>
  <div id="bottom" class="panel"><canvas id="mini" width="96" height="96"></canvas><div id="info"></div><div id="cmds"></div></div>
  <div id="zoom"><button id="z-in" aria-label="Acercar">+</button><button id="z-out" aria-label="Alejar">−</button></div>
  <div id="touchbar"><button id="t-desel" aria-label="Deseleccionar">✕</button><button id="t-army">Ejército</button><button id="t-idle">Inactivo</button></div>
  <div id="placebar" hidden><button id="pb-ok" class="ok">Construir</button><button id="pb-no">Cancelar</button></div>
  <div id="modehint" hidden></div>
</div>
<div id="tip" hidden></div>
<div id="setup" hidden>
  <div class="swrap">
    <header><h1 class="logo">PIXEL EMPIRES</h1><p class="tag">Estrategia en tiempo real en pixel art. Elige tu raza, recolecta, avanza de era, forja alianzas y lleva a tus veteranos y a tu general a la victoria.</p></header>
    <div id="races"></div>
    <div class="opts">
      <div class="opt"><label for="s-team">Tu equipo</label><select id="s-team"><option value="0">Libre (todos contra todos)</option><option value="1">Equipo 1</option><option value="2">Equipo 2</option><option value="3">Equipo 3</option></select></div>
      <div class="opt"><label for="s-rivals">Rivales</label><select id="s-rivals"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
      <div class="opt"><label for="s-diff">Dificultad</label><select id="s-diff"><option value="easy">Fácil</option><option value="normal" selected>Normal</option><option value="hard">Difícil</option></select></div>
      <div class="opt" style="grid-column:1/-1"><label>Rivales: raza, equipo y dificultad</label><div id="rivals"></div></div>
      <div class="opt"><label for="s-map">Mapa</label><select id="s-map"><option value="continental">Continental</option><option value="forest">Bosques profundos</option><option value="mountains">Montañas</option><option value="rivers">Ríos</option><option value="tundra">Tundra</option></select></div>
      <div class="opt"><label for="s-size">Tamaño</label><select id="s-size"><option value="72">Pequeño</option><option value="96" selected>Mediano</option><option value="128">Grande</option></select></div>
      <div class="opt"><label for="s-res">Recursos iniciales</label><select id="s-res"><option value="low">Bajos</option><option value="normal" selected>Normales</option><option value="high">Altos</option></select></div>
      <div class="opt checks"><label><input type="checkbox" id="s-weather" checked> Clima</label><label><input type="checkbox" id="s-dis" checked> Desastres</label><label><input type="checkbox" id="s-reveal"> Mapa revelado</label><label><input type="checkbox" id="s-obs"> Solo observar (IA contra IA)</label></div>
    </div>
    <div class="sbtns"><button id="s-help">Cómo jugar</button><button id="s-gallery">Galería de diseños</button><button id="s-start" class="go">COMENZAR</button></div>
  </div>
</div>
<div id="modal" hidden></div>
</body>
</html>
