<title>Pixel Empires</title>
<meta name="description" content="Estrategia en tiempo real tipo Age of Empires en pixel art: 5 razas, generales únicos, experiencia y diplomacia.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  /* Layout: lienzo a pantalla completa; barra superior y panel inferior de madera con borde dorado */
  --wood:#2a1d14;--wood2:#3a2a1c;--wood3:#4d3826;--gold:#c9a24a;--gold2:#ffd27a;--ink:#140f1f;
  --text:#f4e9c8;--mute:#cdb98e;--good:#8fff7a;--bad:#ff7a6a;--warn:#ffb070;--sel:#5a8ad8;
  --font:"Jersey 10","Courier New",monospace;--font-logo:"Silkscreen","Jersey 10",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0812;color:var(--text);font:18px/1.25 var(--font);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas#game,#hud .panel,#touchbar,#zoom{touch-action:none}
button{touch-action:manipulation}
canvas#game{position:fixed;left:0;top:0;image-rendering:pixelated;cursor:crosshair}
[hidden]{display:none!important}
button{font:inherit;color:var(--text);background:var(--wood3);border:2px solid var(--gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,150,.15);padding:4px 10px;cursor:pointer}
button:hover{background:#5e4630}button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
select,input[type=range]{font:inherit;color:var(--text);background:var(--wood2);border:2px solid var(--gold);padding:2px 4px}
.panel{position:fixed;background:linear-gradient(var(--wood2),var(--wood));border:3px solid var(--gold);box-shadow:0 0 0 3px var(--ink),0 6px 20px rgba(0,0,0,.5)}
#top{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;padding:4px 10px;flex-wrap:wrap}
#resbar{display:flex;gap:14px;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:5px;font-weight:400;font-variant-numeric:tabular-nums}
.res b{min-width:36px;color:#fff}.res b.lack{color:var(--bad)}
.ri{display:inline-block;width:24px;height:24px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;vertical-align:middle}
.tinfo{display:flex;gap:14px;color:var(--mute);margin-left:auto}
#clock{font-variant-numeric:tabular-nums}
.tbtns{display:flex;gap:6px}.tbtns button{padding:2px 8px}.tbtns button.off{opacity:.5}.tbtns button.warn{color:var(--warn);border-color:var(--warn)}
#log{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:calc(var(--topH,48px) + 12px);max-width:min(620px,70vw);pointer-events:none;text-shadow:1px 1px 0 #000,0 0 4px #000;font-size:18px;display:grid;gap:2px}
#proposals{position:fixed;right:14px;top:60px;display:grid;gap:8px;width:300px}
.toast{background:var(--wood2);border:2px solid var(--gold);padding:8px;box-shadow:0 0 0 2px var(--ink)}
.toast div{display:flex;gap:6px;margin-top:6px}
#bottom{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));height:150px;display:flex;gap:10px;padding:8px}
#mini{width:134px;height:134px;flex:none;image-rendering:pixelated;border:2px solid var(--ink);background:#000;cursor:pointer}
#info{flex:1;min-width:0;overflow:hidden;font-size:17px;line-height:1.18}
.hint{color:var(--mute);line-height:1.5}.hint b{color:var(--text)}
.one{display:flex;gap:10px;align-items:flex-start}
.portrait{image-rendering:pixelated;background:rgba(0,0,0,.25);border:2px solid var(--wood3);padding:2px;flex:none;max-height:96px}
.otxt{min-width:0;flex:1}.nm{font-size:22px;font-weight:700;color:var(--gold2)}.sub{color:var(--mute)}.sub.gold{color:var(--gold2)}.warn{color:var(--warn)}
.lvl{font-size:13px;background:var(--gold);color:var(--ink);padding:0 6px;margin-left:4px}
.hpline{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.hpb{display:inline-block;width:24px;height:4px;background:#2a0a0a;position:relative}.hpb>i{position:absolute;inset:0 auto 0 0;background:#5fd35a}
.hpb.big{width:160px;height:8px;border:1px solid var(--ink)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0}.st{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.si{display:inline-block;width:18px;height:18px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
.xp{display:flex;align-items:center;gap:8px;font-size:13px}.xpb{display:inline-block;width:160px;height:8px;background:#1a1430;border:1px solid var(--ink);position:relative}
.xpb>i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#c98a2a,#ffd23a)}.xpb>i.pend{background:repeating-linear-gradient(90deg,rgba(255,210,58,.45) 0 3px,transparent 3px 5px)}
.pxp{color:var(--gold2)}
.multi{display:flex;flex-wrap:wrap;gap:3px;max-height:132px;overflow:hidden}
.mcell{position:relative;width:34px;height:34px;background:rgba(0,0,0,.3);border:1px solid var(--wood3);display:grid;place-items:center;cursor:pointer}
.mcell .hpb{position:absolute;left:3px;right:3px;bottom:2px;width:auto;height:3px}.mcell .lv{position:absolute;right:1px;top:0;font-size:11px;color:var(--gold2);font-style:normal}
.mico,.qi,.cico,.ico{image-rendering:pixelated}
.queue{display:grid;grid-template-columns:repeat(3,30px);gap:4px 4px;flex:none;align-content:start;margin-left:auto}.qcell{position:relative;width:30px;height:30px;background:rgba(0,0,0,.3);border:1px solid var(--wood3);display:grid;place-items:center;cursor:pointer}
.qp{position:absolute;left:0;right:0;bottom:-6px;height:4px;background:#111}.qp i{position:absolute;inset:0 auto 0 0;background:#8ab4ff}
#cmds{flex:none;display:grid;grid-template-columns:repeat(5,44px);grid-auto-rows:42px;gap:4px;align-content:start}
.cmd{position:relative;width:44px;height:42px;padding:0;display:grid;place-items:center;background:var(--wood3)}
.cmd.empty{background:rgba(0,0,0,.2);border-color:#5a4630;box-shadow:none;cursor:default}
.cmd em{position:absolute;right:2px;bottom:-1px;font-size:13px;font-style:normal;color:var(--gold2);text-shadow:1px 1px 0 #000}
.cmd.lack{filter:saturate(.4) brightness(.8)}.cmd.lack em{color:var(--bad)}.cmd.locked{filter:grayscale(1) brightness(.6)}
.cico{max-width:36px;max-height:36px}
#tip{position:fixed;z-index:20;max-width:320px;background:var(--wood);border:2px solid var(--gold);padding:8px;box-shadow:0 0 0 2px var(--ink);font-size:17px;pointer-events:none}
#tip .d{color:var(--mute);margin-top:4px}#tip .hk{color:var(--gold2)}
.cost{display:inline-flex;align-items:center;gap:2px;margin-right:6px;font-variant-numeric:tabular-nums}.cost .ri{width:18px;height:18px}.cost.lack{color:var(--bad)}
#modal{position:fixed;inset:0;z-index:30;background:rgba(8,5,14,.72);display:grid;place-items:center;padding:16px}
.mbox{background:linear-gradient(var(--wood2),var(--wood));border:3px solid var(--gold);box-shadow:0 0 0 3px var(--ink);padding:18px 22px;max-width:min(1100px,96vw);max-height:92vh;overflow:auto}
.mbox h2{margin:0 0 8px;font-size:28px;color:var(--gold2);text-wrap:balance}.mbox h2.win{color:#ffe46a}.mbox h2.lose{color:var(--bad)}
.mbox h3{color:var(--gold2);margin:14px 0 6px}.lead{color:var(--mute);max-width:70ch;margin:0 0 10px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.menu{display:grid;gap:8px;min-width:260px}.menu button{font-size:18px;padding:8px}
.vol{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:14px}
.help{max-width:72ch;color:var(--mute)}.help b{color:var(--text)}.help li{margin:4px 0}
table.dip,table.stats-t{border-collapse:collapse;width:100%}table.dip td,table.stats-t td,table.stats-t th{padding:6px 8px;border-bottom:1px solid var(--wood3);text-align:left;vertical-align:middle}
table.stats-t th{color:var(--gold2);font-weight:600}tr.dead{opacity:.45}
.sw{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);vertical-align:middle}
.stance{display:flex;gap:3px}.stance button{padding:2px 6px;font-size:13px}.stance button.on.ally{background:#2f6a2a}.stance button.on.neutral{background:#6a5a2a}.stance button.on.enemy{background:#7a2a22}
.relbar{position:relative;width:120px;height:8px;background:linear-gradient(90deg,#a03028,#6a5a2a,#2f8a2a);border:1px solid var(--ink)}.relbar i{position:absolute;top:-3px;width:3px;height:14px;background:#fff;transform:translateX(-1px)}
.trib{display:flex;gap:3px;flex-wrap:wrap}.trib button{padding:1px 4px;font-size:12px;display:flex;align-items:center;gap:2px}.trib .ri{width:16px;height:16px}
/* configuración */
#setup{position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#3a2a4a,#120c1c 70%);padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.swrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.logo{font-family:var(--font-logo);font-weight:700;font-size:clamp(36px,6.5vw,72px);margin:0;color:var(--gold2);text-shadow:4px 4px 0 #6b2d0a,8px 8px 0 rgba(0,0,0,.4);letter-spacing:3px;line-height:1}
.tag{color:var(--mute);margin:6px 0 0;max-width:70ch}
#races{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.race{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px;background:linear-gradient(var(--wood2),var(--wood));min-width:0}
.race.on{border-color:var(--gold2);background:linear-gradient(#5a4026,#2a1d14);box-shadow:0 0 0 3px var(--gold2)}
.race b{font-size:20px;color:var(--gold2)}.race small{color:var(--mute);font-size:13px}.race ul{margin:4px 0 0;padding-left:16px;text-align:left;font-size:12px;color:var(--text)}
.rport{image-rendering:pixelated;height:120px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;background:linear-gradient(var(--wood2),var(--wood));border:3px solid var(--gold);padding:14px;box-shadow:0 0 0 3px var(--ink)}
.opt{display:grid;gap:4px}.opt label{color:var(--mute);font-size:13px}
.checks{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.checks label{color:var(--text)}
#rivals{display:grid;gap:6px}.rival{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.sbtns .go{font-size:22px;padding:8px 26px;background:#6b4a26;border-color:var(--gold2)}
.gtabs,.gmode{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.gtabs button.on,.gmode button.on{background:#6b4a26;border-color:var(--gold2)}
.ggrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.ggrid figure{margin:0;display:grid;justify-items:center;gap:2px;background:rgba(0,0,0,.25);padding:6px;border:1px solid var(--wood3)}
.ggrid figcaption{font-size:12px;color:var(--mute);max-width:130px;text-align:center}.gc{image-rendering:pixelated}
/* controles flotantes: zoom (siempre) y botones táctiles */
#zoom{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--panelH,150px) + 26px);display:grid;gap:6px;z-index:5}
#zoom button,#touchbar button{width:44px;height:44px;padding:0;font-size:26px;line-height:1;display:grid;place-items:center;background:rgba(58,42,28,.92)}
#zoom button:disabled{opacity:.4}
#touchbar{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(var(--panelH,150px) + 26px);display:none;gap:6px;z-index:5}
body.touch #touchbar{display:flex}
#touchbar button{font-size:15px;width:auto;min-width:44px;padding:0 10px}
#placebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--panelH,150px) + 26px);display:flex;gap:8px;z-index:6}
#placebar button{font-size:20px;padding:8px 18px}#placebar .ok{background:#2f6a2a;border-color:var(--good)}
#modehint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--topH,48px) + 14px);background:rgba(20,14,10,.85);border:2px solid var(--gold);padding:4px 12px;z-index:6;pointer-events:none;font-size:17px}
/* móvil en horizontal: panel en columna a la derecha (la altura es lo que más escasea) */
@media (max-height:520px) and (orientation:landscape){
  #bottom{left:auto;right:max(6px,env(safe-area-inset-right,0px));top:calc(var(--topH,44px) + 6px);bottom:max(6px,env(safe-area-inset-bottom,0px));width:216px;height:auto;flex-direction:column;padding:6px;gap:5px}
  #mini{width:auto;height:96px;align-self:center}
  #info{flex:1;font-size:13px;line-height:1.1;min-height:0}.nm{font-size:16px}.portrait{max-height:44px}.hpb.big,.xpb{width:92px}
  .one{gap:6px}.stats{gap:6px}.si{width:14px;height:14px}.queue{grid-template-columns:repeat(3,24px)}.qcell{width:24px;height:24px}
  #cmds{grid-template-columns:repeat(5,38px);grid-auto-rows:36px;gap:3px;align-self:center}.cmd{width:38px;height:36px}.cico{max-width:30px;max-height:30px}
  #top{padding:2px 8px;gap:8px}.res{gap:3px;font-size:16px}.ri{width:20px;height:20px}.res b{min-width:28px}
  #log{font-size:15px;max-width:calc(100vw - 260px)}
  #zoom{right:calc(var(--panelW,216px) + 18px);bottom:max(12px,env(safe-area-inset-bottom,0px))}#zoom button{width:40px;height:40px}
  #touchbar{bottom:max(12px,env(safe-area-inset-bottom,0px))}#touchbar button{height:40px}
  #placebar{bottom:max(12px,env(safe-area-inset-bottom,0px));left:calc(50% - var(--panelW,216px) / 2)}
  #proposals{right:calc(var(--panelW,216px) + 20px);width:260px}
  .tinfo{display:none}
}
/* móvil en vertical: minimapa + información arriba, comandos a lo ancho abajo */
@media (max-width:640px){
  :root{--panelH:226px}
  #bottom{height:226px;display:grid;grid-template-columns:86px 1fr;grid-template-rows:88px 1fr;gap:6px;padding:6px}
  #mini{width:86px;height:86px}#info{font-size:14px;line-height:1.1;overflow:hidden}.nm{font-size:17px}.portrait{max-height:58px}.hpb.big,.xpb{width:100px}
  #cmds{grid-column:1/-1;grid-template-columns:repeat(5,1fr);grid-auto-rows:40px;gap:4px;width:100%}.cmd{width:100%;height:40px}
  #top{gap:6px;padding:3px 6px}#resbar{gap:6px}.res{font-size:15px;gap:2px}.ri{width:18px;height:18px}.res b{min-width:24px}
  .tinfo{display:none}#log{font-size:14px;max-width:calc(100vw - 30px)}
  #proposals{width:calc(100vw - 24px);right:12px;top:auto;bottom:calc(var(--panelH) + 80px)}
}
@media (max-width:900px){.tbtns #b-diplo,.tbtns #b-music,.tbtns #b-speed{display:none}}
body.touch .cmd em{display:none}
body.touch #log div:nth-last-child(n+5){display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="setup" hidden>
  <div class="swrap">
    <header><h1 class="logo">PIXEL EMPIRES</h1><p class="tag">Estrategia en tiempo real en pixel art. Elige tu raza, recolecta, avanza de era, forja alianzas y lleva a tus veteranos y a tu general a la victoria.</p></header>

  </div>
</div>

<script>
/* =====================================================================
   Pixel Empires — núcleo de sprites (pixel art generado por código)
   ---------------------------------------------------------------------
   Técnica (Lospec / GameDev.net / PixelJoint):
   * Cada material tiene una rampa de 4 tonos con cambio de matiz: las
     sombras se enfrían (violeta) y las luces se calientan (amarillo).
   * Luz desde arriba a la izquierda + volumen cilíndrico en tramos anchos.
   * Contorno selectivo de 1 px con el tono oscuro del material vecino,
     más suave en el lado iluminado. Nunca negro puro.
   * Material 'team' = color del jugador, así cada diseño sirve a todos.
   API:  new SCanvas(w,h) -> px/rect/ell/ring/poly/line/rim/at/glow
         PE.render(canvas, opts) -> HTMLCanvasElement
         PE.ART.{units,buildings,nature,fx,icons}[key] = definición
         PE.frame(kind,key,f,opts) -> canvas en caché
   ===================================================================== */
'use strict';
var PE = (typeof window !== 'undefined' ? window : globalThis).PE = ((typeof window !== 'undefined' ? window : globalThis).PE || {});

// ------------------------------------------------------------- color
PE.hx = function (c) {
  c = c.replace('#', '');
  if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
  return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16), c.length >= 8 ? parseInt(c.slice(6, 8), 16) : 255];
};
PE.toHex = rgb => '#' + rgb.slice(0, 3).map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h /= 6; if (h < 0) h += 1; }
  return [h, mx ? d / mx : 0, mx];
}

// Sound object that can precache and play ZZFX sounds
class ZZFXSound
{
    constructor(zzfxSound=[])
    {
        this.zzfxSound = zzfxSound;
        
        // extract randomness parameter from zzfxSound
        this.randomness = zzfxSound[1] != undefined ? zzfxSound[1] : .05;
        zzfxSound[1] = 0; // generate without frequency randomness
        
        // cache the sound samples
        this.samples = ZZFX.buildSamples(...zzfxSound);
    }

    play(volume=1, pitch=1, randomnessScale=1, pan=0, loop=false)
    {
        if (!this.samples) return;

        // play the sound
        const playbackRate = pitch + pitch * this.randomness*randomnessScale*(Math.random()*2-1);
        this.source = ZZFX.playSamples([this.samples], volume, playbackRate, pan, loop);
        return this.source;
    }
}

// ---- Montura: pata animada (fase ph del ciclo de 8 frames de walk)
function qleg(c, P, m, hoof, hx, hy, ph, front, w = 2, amp = 2.5, lift = 3, gy = 29) {
  let dx = 0, up = 0;
  if (P.anim === 'walk') { const t = (P.t / 8 + ph) * 2 * PI; dx = -Math.cos(t) * amp; up = Math.max(0, Math.sin(t)) * lift; }
  const fx = Math.round(hx + dx), fy = Math.round(gy - up);
  const kx = Math.round((hx + fx) / 2 + (front ? 1 : -1) * up * .7), ky = Math.round(hy + (fy - hy) * .5 - up * .3);
  limb(c, m, hx, hy, kx, ky, w); limb(c, m, kx, ky, fx, fy - 1, w);
  c.rect(hoof, fx, fy, fx + w - 1, fy);
}

// esbeltos y altos: cabeza y≈8.8 r≈4.3, torso x12–19 y13–22, piernas largas y21–29
const EL = [13, 14], ER = [17, 18];
const arc = (cx, cy, r, a0, a1, n = 8) => Array.from({ length: n + 1 }, (_, i) => { const t = (a0 + (a1 - a0) * i / n) * PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; });
const SICKLE = [...arc(3, -7.5, 4.2, 150, 360), ...arc(3.3, -7.2, 3, 360, 200)];
// cimitarra élfica (curva hacia +x); s = -1 la refleja
const scim = s => [[-1 * s, -1.5], [1 * s, -1.5], [1.6 * s, -6], [2 * s, -9], [1.4 * s, -12.5], [.2 * s, -9.5], [-.6 * s, -6]];
// cabeza élfica: o.hair, o.long (melena detrás), o.top (false = sin flequillo), o.ears
function elfHead(c, o = {}) {
  const h = o.hair || 'elfhair', h2 = h === 'silver' ? 'steel' : 'ua_blond';
  if (o.long) c.poly(h2, [[11, 6], [20, 6], [21, 15 + (o.sw || 0) * .5], [10, 15 + (o.sw || 0) * .5]]);
  c.ell('elfskin', 15.5, 8.8, 4.2, 4.5);
  if (o.top !== false) { c.ell(h, 15.5, 5.6, 4.8, 2.7); c.rect(h2, 11, 6, 12, 9); c.rect(h2, 19, 6, 20, 9); c.px(h, 13, 7); c.px(h, 11, 5); c.px(h, 20, 5); }
  if (o.ears !== false) {
    c.poly('elfskin', [[12, 8], [7.5, 4.5], [12, 10.5]]); c.poly('elfskin', [[19, 8], [23.5, 4.5], [19, 10.5]]);
    c.px('elfskin.0', 10, 7); c.px('elfskin.0', 21, 7);
  }
  c.px('eye', 14, 9); c.px('eye', 17, 9); c.px('elfskin.0', 15, 11); c.px('elfskin.0', 16, 11);
}
// arco élfico (curvo, puntas recurvas doradas). x0 = línea de la cuerda, dir +1 = barriga a la derecha
function elfBow(c, m, x0, y0, y1, bulge, dir, tip = 'gold') {
  const cy = (y0 + y1) / 2 + .5, ry = (y1 - y0) / 2 + .5;
  c.ring(m, x0 + .5, cy, bulge, ry, .6, x => dir > 0 ? x >= x0 : x <= x0);
  c.px(tip, x0 - dir, y0 - 1); c.px(tip, x0, y0); c.px(tip, x0 - dir, y1 + 1); c.px(tip, x0, y1);
  c.rect('leather', x0 + dir * Math.round(bulge) - (dir > 0 ? 1 : 0), cy - 1.5, x0 + dir * Math.round(bulge) - (dir > 0 ? 0 : -1), cy + .5);
}
// cuerda: recta o tensada hasta (nx, ny) con flecha hacia dir
function bowString(c, x0, y0, y1, pull, ny, dir, arrow, head = 'steel', fl = 'team') {
  if (pull <= 0) { const x = x0 + (pull < 0 ? dir : 0); c.line('string', x, y0 + 1, x, y1 - 1); return; }   // pull -1 = cuerda recién suelta
  const nx = x0 - dir * pull;
  c.line('string', x0, y0, nx, ny); c.line('string', nx, ny + 1, x0, y1);
  if (arrow) {
    const tx = x0 + dir * arrow;
    c.line('wood', nx, ny, tx - dir, ny); c.px(head, tx, ny); c.px(head, tx - dir, ny - 1); c.px(head, tx - dir, ny + 1);
    c.px(fl, nx + dir, ny - 1); c.px(fl, nx + dir, ny + 1); c.px('feather', nx + 2 * dir, ny - 1); c.px('feather', nx + 2 * dir, ny + 1);
  }
}

  qleg(c, P, 'ua_deer.0', 'ua_hoof', 26, 18 + b, .62, 1, 2, 3, 3.5);

// bajos y anchos: cabeza grande y≈11.5 r≈4.7, barba enorme y12–23, torso x9–22 y14–25, piernas cortas y25–29
const DL = [11, 14], DR = [17, 20];
function dwarfBody(c, m, belt = 'leather') {
  c.rect(m, 9, 15, 22, 25); c.rect(m, 10, 14, 21, 14);

}
// cabeza enana: cara bajo el casco, nariz grande, cejas pobladas y barba enorme (o.braid = trenzas con anillos)
function dwarfHead(c, bd, o = {}) {
  c.ell('skin', 15.5, 11.5, 4.7, 4.2);
  c.poly(bd, [[10, 12], [21, 12], [21.5, 16], [19.5, 20.5], [15.5, 23], [11.5, 20.5], [9.5, 16]]);
  c.line(bd + '.0', 13, 16, 14, 20); c.line(bd + '.0', 18, 16, 17, 20); c.px(bd + '.0', 15, 18); c.px(bd + '.0', 16, 21);
  if (o.braid) { c.rect(bd, 13, 20, 14, 25); c.rect(bd, 17, 20, 18, 25); c.rect('gold', 13, 23, 14, 23); c.rect('gold', 17, 23, 18, 23); c.px(bd + '.0', 13, 22); c.px(bd + '.0', 18, 22); }
  c.rect(bd + '.2', 11, 13, 14, 13); c.rect(bd + '.2', 17, 13, 20, 13); c.rect(bd, 12, 14, 19, 14);       // bigote
  c.rect('skin', 15, 11, 16, 13); c.px('skin.3', 15, 11); c.px('skin.0', 16, 13);                       // nariz
  c.px('eye', 13, 11); c.px('eye', 18, 11); c.rect(bd, 12, 10, 14, 10); c.rect(bd, 17, 10, 19, 10);        // ojos y cejas
}
// brazos gruesos de enano
const dArmL = (c, m, f = 'skin') => { c.rect(m, 6, 15, 8, 20); c.rect(f, 6, 21, 8, 22); };
const dArmR = (c, m, f = 'skin') => { c.rect(m, 23, 15, 25, 20); c.rect(f, 23, 21, 25, 22); };

(function () {
'use strict';
const U = PE.ART.units;

// ------------------------------------------------------------- materiales propios (prefijo ub_)
PE.addMats({
  ub_hide: '#c4a074',   // cuero curtido claro (escudos, techos)
  ub_rag: '#7d6447',    // harapos marrones
  ub_rag2: '#56473c',   // capucha / pañuelo oscuro
  ub_gob: '#a3bf6c',    // piel goblin verde pálido
  ub_ogre: '#b5926b',   // piel de ogro
  ub_wolf: '#8c8f9c',   // pelaje de lobo gris
  ub_mamm: '#87512f',   // pelaje de mamut
  ub_rope: '#c9ab72',   // cuerda
  ub_boulder: '#6f7a8c',// roca azulada de los lanzarrocas
});
PE.addFixed({
  ub_sm: '#fff6e070',   // estela de golpe (semitransparente)
  ub_frost: '#c9f7ffb4',// aliento helado
  ub_bolt: '#eafcff',   // relámpago
});

// ------------------------------------------------------------- utilidades
const D2R = Math.PI / 180, lerp = (A, B, k) => A + (B - A) * k;
// marco local de un arma: u a lo largo del asta desde la mano, v perpendicular
const fr = (px, py, ang) => { const r = ang * D2R, cs = Math.cos(r), sn = Math.sin(r); return (u, v) => [px + u * cs - v * sn, py + u * sn + v * cs]; };
const pw = (t, m, f, pts) => t.poly(m, pts.map(p => f(p[0], p[1])));
const bar = (t, m, f, u0, u1, w) => {
  if (w <= 1) { const [x0, y0] = f(u0, 0), [x1, y1] = f(u1, 0); t.line(m, x0, y0, x1, y1); return; }
  pw(t, m, f, [[u0, -w / 2], [u1, -w / 2], [u1, w / 2], [u0, w / 2]]);
};
// miembro (brazo, pata) de grosor w entre dos puntos
const limb = (c, m, x0, y0, x1, y1, w) => {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L * w / 2, ny = dx / L * w / 2;
  c.poly(m, [[x0 + nx, y0 + ny], [x1 + nx, y1 + ny], [x1 - nx, y1 - ny], [x0 - nx, y0 - ny]]);
};
// halo pulsante alrededor de un punto
const halo = (c, cx, cy, r, g, hex) => {
  const R = r + 0.8 + g * 0.9;
  for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
    const d = Math.hypot(x + .5 - cx, y + .5 - cy);
    if (d > r && d <= R) c.glow(x, y, d < r + 1.3 ? 135 : 65, hex);
  }
};
// estela de golpe: arco alrededor de (cx,cy) entre a0 y a1 (grados)
const smear = (c, cx, cy, r, a0, a1, w = 2) => {
  for (let a = a0; a0 < a1 ? a <= a1 : a >= a1; a += a0 < a1 ? 4 : -4) for (let k = 0; k < w; k++) {
    const rr = r - k, x = cx + Math.cos(a * D2R) * rr, y = cy + Math.sin(a * D2R) * rr;
    if (c.get(Math.round(x + c.ox), Math.round(y + c.oy)) === null) c.px('ub_sm', x, y);   // sólo sobre fondo vacío
  }
};
// rayo en zigzag entre dos puntos (semilla fija por frame)
const bolt = (c, x0, y0, x1, y1, seed, m = 'ub_bolt') => {
  const n = 5, cx = x => Math.max(1 - c.ox, Math.min(c.w - 2.6 - c.ox, x)), cy = y => Math.max(1 - c.oy, Math.min(c.h - 2.6 - c.oy, y));
  let px = cx(x0), py = cy(y0);
  for (let i = 1; i <= n; i++) {
    const k = i / n, j = i === n ? 0 : (((seed * 7 + i * 13) % 5) - 2) * 0.9;
    const nx = cx(lerp(x0, x1, k) + (y1 - y0 ? j : 0) * 0.3), ny = cy(lerp(y0, y1, k) + j);   // dentro del lienzo
    c.line(m, px, py, nx, ny); px = nx; py = ny;
  }
};

// ------------------------------------------------------------- bultos de trabajador (32 px, hombro izq.)
function load32(c, kind) {
  if (kind === 'wood') {        // dos troncos al hombro con la veta a la vista
    c.rim(t => t.rect('x', 1, 11, 12, 13), 'wood'); c.rim(t => t.rect('x', 2, 7, 12, 9), 'wood');
    c.line('darkwood', 3, 12, 11, 12); c.line('darkwood', 4, 8, 11, 8);
    for (const [x, y] of [[1, 11], [2, 7]]) { c.rect('cloth', x, y, x, y + 2); c.px('wood.0', x, y + 1); }
    c.rect('ub_rope', 7, 7, 7, 13);
  } else if (kind === 'food') { // saco con un jamón
    c.ell('sack', 5.5, 11.2, 4.6, 4); c.rect('ub_rope', 8, 7, 9, 8); c.px('sack.0', 5, 13); c.px('sack.0', 3, 12);
    c.ell('red', 4.5, 6.5, 2.4, 1.7); c.px('red.2', 4, 6); c.rect('bone', 1, 5, 2, 5); c.px('bone', 1, 4); c.ell('leaf', 8, 6.5, 1.3, 1.2);
  } else if (kind === 'gold') { // saco rebosante de pepitas
    c.ell('sack', 5.5, 11.6, 4.4, 3.8); c.rect('ub_rope', 3, 8, 8, 8);
    for (const [x, y] of [[2, 7], [4, 6], [6, 5], [8, 6], [5, 7], [7, 7], [3, 8]]) c.px('gold', x, y);
    c.px('gold.3', 6, 5); c.px('gold.3', 2, 7); c.px('gold.0', 5, 7);
  } else if (kind === 'stone') { // bloque de piedra
    c.rim(t => t.poly('x', [[0.5, 9], [3, 5.5], [10, 6], [11.5, 10], [10, 14.5], [1.5, 14.5]]), 'stone');
    c.line('stone.0', 4, 9, 7, 12); c.line('stone.0', 7, 12, 9, 12); c.px('stone.3', 3, 7); c.px('stone.3', 4, 7); c.px('stone.0', 9, 14);
  } else if (kind === 'iron') {  // mena de hierro con óxido
    c.rim(t => t.poly('x', [[0.5, 10], [2.5, 6], [7, 5], [11, 8], [11, 13.5], [6, 15], [1.5, 14]]), 'iron');
    c.px('copper', 4, 11); c.px('copper', 5, 11); c.px('copper', 8, 9); c.px('copper.0', 7, 13); c.px('iron.3', 4, 7); c.px('iron.3', 9, 12); c.px('iron.3', 3, 8);
  }
}

// ------------------------------------------------------------- orcos (32×32): encorvados y fornidos
const OSK = 'orcskin';
// hombros (8,16.5) y (23,16.5); brazos colgando por fuera del torso para que el contorno los separe
function orcLegs(c, P, pm = 'leather', bm = 'fur') {
  c.at(0, P.ll, () => { c.rect(pm, 10, 23, 14, 26); c.rect(bm, 9, 26, 14, 29); c.px(null, 9, 26); c.rect(bm + '.0', 10, 27, 14, 27); });
  c.at(0, P.lr, () => { c.rect(pm, 17, 23, 21, 26); c.rect(bm, 17, 26, 22, 29); c.px(null, 22, 26); c.rect(bm + '.0', 17, 27, 21, 27); });
}
function orcTorso(c, b, s = OSK) {
  c.at(0, b, () => {
    c.ell(s, 15.5, 15.4, 7.8, 3.8);                                               // trapecios / joroba
    c.poly(s, [[8, 14.5], [23, 14.5], [22, 18.5], [20.5, 23], [10.5, 23], [9, 18.5]]); // pecho ancho, cintura
    c.rect(s + '.0', 11, 18, 14, 18); c.rect(s + '.0', 17, 18, 20, 18);
  });
}
// cabeza baja, mandíbula ancha y colmillos; contorno propio para separarla del torso
function orcHead(c, b, o = {}) {
  const s = o.skin || OSK, eye = o.eye || 'glowY';
  c.at(0, b, () => {
    c.rim(t => {
      t.ell('x', 15.5, 10.2, 4.6, 4.2); t.rect('x', 11, 11, 20, 13); t.rect('x', 12, 14, 19, 14);
      t.px('x', 10, 9); t.px('x', 9, 8); t.px('x', 21, 9); t.px('x', 22, 8);
    }, s);
    c.rect(s + '.0', 12, 9, 14, 9); c.rect(s + '.0', 17, 9, 19, 9);
    c.px(eye, 13, 10); c.px(eye, 18, 10);
    c.px(s + '.2', 15, 10); c.px(s + '.2', 15, 11); c.px(s + '.0', 16, 11);
    c.rect('ol', 14, 13, 17, 13);
    c.px('bone', 13, 12); c.px('bone', 13, 13); c.px('bone', 18, 12); c.px('bone', 18, 13);
    if (o.paint) { c.px('red', 12, 11); c.px('red', 12, 12); c.px('red', 19, 11); c.px('red', 19, 12); c.rect('red', 15, 6, 16, 8); }
  });
}
const fist = (c, s, x, y) => c.ell(s, x, y, 1.7, 1.7);
const orcArm = (c, x0, y0, x1, y1, br) => { limb(c, OSK, x0, y0, x1, y1, 3); if (br) limb(c, br, lerp(x0, x1, .55), lerp(y0, y1, .55), lerp(x0, x1, .9), lerp(y0, y1, .9), 3.4); };
// hacha arrojadiza (u desde la mano, filo hacia v+)
const AXE_S = [[4, 0.5], [6.5, 0.5], [7.6, 3.6], [3, 3.6]];
const throwAxe = (c, f) => {
  c.rim(t => { bar(t, 'x', f, -1, 6.5, 2); pw(t, 'x', f, AXE_S); }, 'wood');
  pw(c, 'iron', f, AXE_S); pw(c, 'blade', f, [[3, 2.9], [7.4, 2.9], [7.6, 3.6], [3, 3.6]]);
};

    if (cr) c.at(0, b, () => { orcArm(c, 8, 16.5, 6.5, 12.5); c.rect('team', 5, 15, 9, 16); load32(c, cr); fist(c, OSK, 7, 12.5); });
    else c.at(0, b + P.s, () => { orcArm(c, 8, 16.5, 6, 22.5); c.rect('team', 5, 17, 9, 18); fist(c, OSK, 6, 23); });

      c.rim(t => { bar(t, 'x', f, -3, 12, 2); pw(t, 'x', f, head); pw(t, 'x', f, sp); }, 'wood');
      pw(c, 'iron', f, head); pw(c, 'iron', f, sp); pw(c, 'blade', f, [[6.4, 4.4], [12.6, 4.4], [12.6, 5.2], [6.4, 5.2]]);
      bar(c, 'ub_rope', f, 8.6, 10.4, 2);
      fist(c, OSK, T[0], T[1]);
    });
  },
};

// lobo gigante de perfil (mirando a la derecha) para 40×32
function wolf(c, P, lunge) {
  const b = P.body, walk = P.anim === 'walk', W = 'ub_wolf';
  for (const [hx, ph, far, hind] of [[12.5, 0, 1, 1], [26, .5, 1, 0], [15, .14, 0, 1], [28.5, .64, 0, 0]]) {
    let dx = 0, lift = 0;
    if (walk) { const th = 2 * Math.PI * (P.t / 8 + ph); dx = 2.6 * Math.cos(th); lift = Math.max(0, 2.2 * Math.sin(th)); }
    else if (lunge) dx = hind ? -1.5 : 2;
    const m = far ? W + '.0' : W, hy = 19.5 + b, fy = 28.5 - lift, fx = hx + dx + (hind ? -0.5 : 0.5);
    const kx = hind ? hx - 2.2 + dx * .3 : hx + dx * .5, ky = hind ? 24.8 - lift * .5 : 24.5 - lift * .4;
    limb(c, m, hx, hy, kx, ky, hind ? 4.2 : 3.4); limb(c, m, kx, ky, fx, fy, 2.8);
    c.rect(m, Math.round(fx) - 1, Math.round(fy), Math.round(fx) + 2, Math.round(fy)); c.px(far ? 'ol' : W + '.0', Math.round(fx) + 2, Math.round(fy));
  }
  c.at(lunge ? 1 : 0, b, () => {
    c.at(0, -P.sec, () => { c.poly(W, [[10, 15], [6, 11.5], [2, 10.5], [1.5, 13], [4, 15.5], [9, 19]]); c.px(W + '.3', 2, 11); c.px(W + '.3', 3, 11); });
    c.ell(W, 13, 18, 5, 4.6);
    c.ell(W, 20, 18.2, 9, 4);
    c.ell(W, 26.5, 17.5, 4.8, 5.2);
    c.poly(W, [[24, 13], [30, 9], [34, 11], [32, 19.5], [26.5, 20]]);
    c.line(W + '.0', 25, 13, 29, 10.5); c.line(W + '.0', 15, 14, 22, 14); c.px(W + '.3', 30, 17); c.px(W + '.3', 31, 15); c.px(W + '.3', 29, 19);
  });
}
function wolfHead(c, P, lunge, bite) {
  const W = 'ub_wolf';
  c.at(lunge ? 1 : 0, P.body + (lunge ? 1 : 0), () => {
    c.ell(W, 32.5, 11.8, 3.8, 3.4);
    c.poly(W, [[30, 5.5], [32, 9], [29.5, 9.5]]); c.poly(W, [[33, 5.5], [34.5, 9], [32.5, 9.5]]);
    c.px(W + '.0', 30, 7); c.px(W + '.0', 33, 7);
    if (bite) {
      c.poly(W, [[33.5, 10], [38.5, 9], [38.5, 11.2], [34.5, 12.5]]);
      c.poly(W, [[33, 14], [37.5, 15.5], [37.5, 16.6], [33, 16]]);
      c.poly('red', [[34.5, 12.5], [38, 11.4], [37.5, 15.4], [33.5, 14]]);
      c.px('white', 37, 11.6); c.px('white', 35, 12.2); c.px('white', 36, 14.6); c.px('ol', 38, 9);
    } else {
      c.poly(W, [[33.5, 10], [38.5, 11], [38.5, 13.2], [33.5, 15]]);
      c.line('ol', 34, 14, 38, 13); c.px('white', 36, 14); c.px('ol', 38, 11);
    }
    c.px('glowY', 33, 10.6); c.px('ol', 32, 10);
  });
}

}

  c.at(0, b, () => {
    c.ell(s, 19.5, 19, 10, 4.8);
    c.poly(s, [[10, 18], [29, 18], [28, 23], [26.5, 30], [12.5, 30], [11, 23]]);

}
function giantHead(c, b, o = {}) {
  const s = o.skin || GSK, eye = o.eye || 'eye';
  c.at(0, b + (o.dy || 0), () => {

function basketLoad(c, kind) {
  if (kind === 'wood') {
    c.rim(t => t.rect('x', 5, 3, 33, 5), 'wood'); c.rim(t => t.rect('x', 7, 0, 31, 2), 'wood');   // troncos atravesados

    c.rect('ub_rope', 12, 0, 12, 5); c.rect('ub_rope', 27, 0, 27, 5);
  } else if (kind === 'food') {
    c.ell('leaf', 11.5, 4, 3, 2.6); c.ell('leaf', 27.5, 4, 3, 2.6); c.ell('leaf', 19.5, 3, 3.4, 2.6);
    c.px('leaf.3', 10, 3); c.px('leaf.3', 18, 2); c.px('leaf.3', 26, 3); c.line('leaf.0', 19, 2, 20, 4);
    c.ell('red', 15, 4.5, 2, 1.6); c.ell('red', 24, 4.5, 2, 1.6); c.px('bone', 14, 3); c.px('bone', 25, 3);
  } else if (kind === 'gold') {
    c.ell('gold', 19.5, 5, 10, 3); for (const [x, y] of [[12, 3], [16, 2], [20, 1], [24, 2], [27, 3]]) { c.px('gold', x, y); c.px('gold.3', x, y); }
    c.px('gold.0', 15, 5); c.px('gold.0', 23, 4); c.px('gold.0', 19, 6);

    for (const [x, y, r] of [[11, 4, 2.6], [16.5, 3, 2.6], [22.5, 3.2, 2.8], [28, 4, 2.6]]) c.rim(t => t.ell('x', x, y, r, r * 0.85), 'stone');
    c.px('stone.3', 10, 3); c.px('stone.3', 16, 2); c.px('stone.3', 22, 2); c.px('stone.3', 27, 3);
  } else if (kind === 'iron') {
    for (const [x, y] of [[11, 4], [17, 3], [23, 3], [28, 4]]) c.rim(t => t.poly('x', [[x - 2.5, y + 1.5], [x - 1, y - 2], [x + 2, y - 1.5], [x + 2.5, y + 1.5]]), 'iron');
    c.px('copper', 11, 4); c.px('copper', 23, 3); c.px('iron.3', 17, 2); c.px('iron.3', 28, 3); c.px('copper.0', 18, 4);
  }

// mamut de perfil (mirando a la derecha) para 48×40
function mammoth(c, P, a) {
  const b = P.body, walk = P.anim === 'walk', M = 'ub_mamm';
  const hd = a === 1 ? [0, -2] : a === 2 ? [1, 2] : a === 3 ? [1, 1] : [0, 0];
  // patas: [x, fase, lejana]
  for (const [hx, ph, far] of [[12, 0, 1], [29, .5, 1], [16, .25, 0], [33, .75, 0]]) {
    let dx = 0, lift = 0;
    if (walk) { const th = 2 * Math.PI * (P.t / 8 + ph); dx = 1.8 * Math.cos(th); lift = Math.max(0, 1.6 * Math.sin(th)); }
    const m = far ? M + '.0' : M, x = hx + dx, y = 37 - lift;
    c.poly(m, [[hx - 2.5, 26 + b], [hx + 2.5, 26 + b], [x + 2.5, y - 1], [x - 2.5, y - 1]]);
    c.rect(far ? 'bone.0' : 'bone', Math.round(x) - 2, Math.round(y), Math.round(x) + 2, Math.round(y)); c.px(m, Math.round(x), Math.round(y));
  }
  c.at(0, b, () => {
    c.line(M, 7, 22, 4, 27); c.px(M + '.0', 4, 28);                       // cola
    c.ell(M, 21, 25, 14, 8.5);                                             // cuerpo
    c.ell(M, 29, 21, 7, 7);                                                // joroba de los hombros
    for (let x = 9; x <= 33; x += 2) c.line(M + '.0', x, 31, x - (x & 2 ? 1 : 0), 33 + (x % 3 ? 0 : 1));  // flecos de pelo
    c.line(M + '.0', 12, 27, 18, 29); c.line(M + '.0', 22, 29, 27, 28);
  });
  c.at(hd[0], b + hd[1], () => {
    c.ell(M, 36.5, 20, 6, 7);                                              // cabeza abovedada
    c.ell(M, 34, 21, 2.4, 3.4); c.ell(M + '.0', 34, 21.5, 1.6, 2.6);       // oreja
    c.px('eye', 38, 19); c.px(M + '.3', 36, 15);
    // trompa
    const tr = a === 1 ? [[40, 20], [43.5, 15], [45.5, 11], [46, 13], [44, 17], [41.5, 23]] : [[39, 22], [42.5, 22], [43, 30], [44.5, 33], [43, 35], [41, 32], [39.5, 27]];
    c.poly(M, tr);
    if (a !== 1) { c.px(M + '.0', 41, 25); c.px(M + '.0', 41, 28); c.px(M + '.0', 42, 31); }
    // colmillos curvos
    c.rim(t => { t.poly('x', [[38, 25], [41, 27.5], [44, 27.5], [45.6, 25], [46, 22], [44.6, 24.5], [42, 25.5], [39.5, 23.5]]); }, 'bone');
    c.px('bone.3', 45, 23);
  });
}

/* =====================================================================
   Pixel Empires — Edificios (PE.ART.buildings)
   5 razas × 17 tipos + 4 neutrales. Vista 3/4 frontal: fachada sur + techo.
   w = huella×16; la fila inferior es el borde inferior de la huella.
   Estructura: utilidades (texturas, banderas, humo, props) → kit por raza
   (hall = cuerpo con muro+techo, puerta, ventana, torre...) → constructores
   por tipo (base + techo + elemento identificativo) → registro.
   Animación f = 0..3 (granja: etapa de crecimiento; puerta: 0 cerrada 1 abierta).
   ===================================================================== */
(() => {
'use strict';
const B = PE.ART.buildings;
PE.addMats({
  bld_elfwood: '#cdb07e', bld_bark: '#8c8578', bld_moon: '#d3d0c2', bld_elfglass: '#62e0a6',
  bld_granite: '#7d7984', bld_slate: '#4f5a74', bld_hide: '#b48c5e', bld_turf: '#86a346',
  bld_logend: '#dbb47a', bld_glass: '#78b4ff', bld_pumpkin: '#e0832c', bld_cabbage: '#93c862',
  bld_mush: '#c94a3c', bld_grape: '#7b3f9e', bld_horse: '#b0703e', bld_rag: '#9a8a6a', bld_elfleaf: '#3f9a78',
});
PE.addFixed({ bld_hole: '#221a2b', bld_hole2: '#33263a' });
PE.addEmissive('bld_elfglass', 'bld_glass');

// ------------------------------------------------------------- utilidades
const PI = Math.PI, md = (a, n) => ((a % n) + n) % n, T = (m, k) => m + '.' + k;
const hs = (a, b) => { let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };
const PUL = [1, 2, 3, 2];                       // pulso de runas por frame
// Textura: fn(x,y) -> tono 0..3 | null, sólo sobre píxeles con material m exacto (sin tono)
function tex(c, m, x0, y0, x1, y1, fn) {
  for (let y = Math.round(y0); y <= y1; y++) for (let x = Math.round(x0); x <= x1; x++)
    if (c.get(x + c.ox, y + c.oy) === m) { const k = fn(x, y); if (k != null) c.px(T(m, k), x, y); }
}
const R = (c, m, x0, y0, x1, y1, fn) => { c.rect(m, x0, y0, x1, y1); if (fn) tex(c, m, x0, y0, x1, y1, fn); };
// trapecio: base yb (incl.) de xl a xr, cima yt con entrantes iL/iR
const trap = (c, m, xl, xr, yb, yt, iL, iR = iL) => c.poly(m, [[xl, yb + 1], [xr + 1, yb + 1], [xr + 1 - iR, yt], [xl + iL, yt]]);
const P = {   // patrones de textura
  brick: (ox, oy, bw, bh, hl = 3) => (x, y) => {
    const r = y - oy, k = Math.floor(r / bh), rr = md(r, bh), sx = x - ox + (k & 1) * (bw >> 1), xx = md(sx, bw);
    if (rr === bh - 1 || xx === bw - 1) return 0;
    if (hl && rr === 0 && xx === 0 && hs(k, Math.floor(sx / bw)) % hl === 0) return 2;
    return null;
  },
  tile: (ox, oy, bw = 4, bh = 3) => (x, y) => {      // tejas planas en hiladas escalonadas
    const r = y - oy, k = Math.floor(r / bh), rr = md(r, bh), xx = md(x - ox + (k & 1) * (bw >> 1), bw);
    if (rr === bh - 1) return 0;
    if (rr === bh - 2 && xx === bw - 1) return 0;
    return rr === 0 && xx < 2 ? 2 : null;
  },
  scale: (ox, oy, bw = 4, bh = 3) => (x, y) => {     // escamas de hoja: puntas colgantes escalonadas
    const r = y - oy, k = Math.floor(r / bh), rr = md(r, bh), j = Math.floor((x - ox + (k & 1) * (bw >> 1)) / bw), xx = md(x - ox + (k & 1) * (bw >> 1), bw);
    const v = hs(j, k) % 4;
    if (rr === bh - 1) return xx === 1 ? (v ? 1 : 0) : 0;
    if (rr === 0) return xx === 1 ? 3 : xx === 2 ? 2 : (xx === 0 ? 1 : null);
    return xx === 1 ? 2 : xx === bw - 1 ? 0 : null;
  },
  slate: (ox, oy, bw = 6, bh = 3) => (x, y) => {     // losas de pizarra
    const r = y - oy, k = Math.floor(r / bh), rr = md(r, bh), xx = md(x - ox + (k & 1) * (bw >> 1), bw);
    if (rr === bh - 1) return 0;
    if (xx === bw - 1) return 0;
    if (rr === 0) return xx < 3 ? 2 : null;
    return null;
  },
  thatch: (oy) => (x, y) => {                       // paja: hileras con flecos
    const r = y - oy, rr = md(r, 4), k = Math.floor(r / 4), v = hs(x, k) % 6;
    if (rr === 3) return v < 4 ? 0 : null;
    if (v === 0) return 0;
    if (v === 1 && rr < 2) return 2;

    if (K.id === 'giant') { c.rect('wood', x, yb - 9, x + 1, yb - 1); c.rect('bld_logend', x - 1, yb - 12, x + 2, yb - 9); c.px('iron', x - 1, yb - 11); c.px('iron', x + 2, yb - 10); }
    else if (K.id === 'dwarf' || K.id === 'orc') { c.line('darkwood', x, yb - 1, x, yb - 11); c.rect(K.blade, x + 1, yb - 12, x + 2, yb - 9); c.px(T(K.blade, 3), x + 1, yb - 12); if (K.id === 'orc') c.px('bone', x - 1, yb - 12); }
    else { c.line(K.wood, x, yb - 1, x, yb - 11); c.px(T(K.blade, 2), x, yb - 12); c.px(T(K.blade, 3), x, yb - 13); c.px(T(K.blade, 2), x, yb - 14); if (K.id === 'elf') c.px(T(K.blade, 3), x + 1, yb - 13); }
  }
}
// Herradura
function shoe(c, cx, cy, m = 'iron') { c.ring(T(m, 2), cx, cy, 3, 3, 0.2, (x, y) => y < cy + 1); c.rect(T(m, 1), cx - 3, cy + 1, cx - 2, cy + 2); c.rect(T(m, 0), cx + 1, cy + 1, cx + 2, cy + 2); c.px(T(m, 3), cx - 2, cy - 2); }
// Campana (oscila con f)
function bell(c, cx, y, f, m = 'gold') {
  const d = [0, 1, 0, -1][f];
  c.line('darkwood', cx - 3, y, cx + 3, y);
  c.at(d, 0, () => { c.rect(m, cx - 1, y + 1, cx + 1, y + 2); c.rect(m, cx - 2, y + 3, cx + 2, y + 4); c.rect(m, cx - 3, y + 5, cx + 3, y + 5); c.px('iron', cx, y + 6); c.px(T(m, 3), cx - 1, y + 2); });
}
// Calavera 3×3
function skull(c, x, y, m = 'bone') { c.rect(m, x, y, x + 2, y + 1); c.px(m, x + 1, y + 2); c.px('ol', x, y + 1); c.px('ol', x + 2, y + 1); }
// Mercancías sobre mostrador
function goods(c, x0, x1, y) {
  const g = ['red', 'gold', 'bld_cabbage', 'bld_pumpkin', 'bld_grape', 'cloth'];
  for (let x = x0, i = 0; x <= x1 - 1; x += 3, i++) { const m = g[hs(x, y) % g.length]; c.rect(m, x, y - 1, x + 1, y); c.px(T(m, 3), x, y - 1); }
}
// Toldo a rayas (a / b) con borde festoneado; trapecio de y0 a y1
function awning(c, x0, x1, y0, y1, o = {}) {
  const a = o.a || 'team', b = o.b || 'cloth', sw = o.sw || 3;
  for (let y = y0; y <= y1; y++) {
    const t = (y - y0) / Math.max(1, y1 - y0), xl = Math.round(x0 + 1 - t * 2), xr = Math.round(x1 - 1 + t * 2);
    for (let x = xl; x <= xr; x++) c.px(md(x - x0, sw * 2) < sw ? a : b, x, y);
  }
  for (let x = x0 - 1; x <= x1 + 1; x++) if (md(x - x0, sw) !== sw - 1) c.px(md(x - x0, sw * 2) < sw ? T(a, 0) : T(b, 0), x, y1 + 1);
}
// Almenas: merlones mw de ancho, separación g
function battl(c, m, x0, x1, y, mw = 2, g = 2, mh = 2) { for (let x = x0; x <= x1; x += mw + g) c.rect(m, x, y - mh + 1, Math.min(x + mw - 1, x1), y); }
function fenceH(c, x0, x1, y, m = 'wood') { c.line(m, x0, y - 2, x1, y - 2); c.line(T(m, 0), x0, y - 1, x1, y - 1); for (let x = x0; x <= x1; x += 4) c.rect(T(m, 2), x, y - 3, x, y); }
function fenceV(c, x, y0, y1, m = 'wood') { c.line(m, x, y0, x, y1); for (let y = y0; y <= y1; y += 4) c.rect(T(m, 2), x, y - 2, x, y); }

// Puerta de establo partida (abajo tablones con aspa, arriba abierta con caballo o cerrada)
function sdoor(c, K, cx, yb, w, h, beastId, f) {
  const x0 = Math.round(cx - w / 2), x1 = x0 + w - 1, yt = yb - h + 1, ym = yt + (h >> 1) - 1;
  c.rect(K.beam, x0 - 1, yt - 1, x1 + 1, yb); c.rect(T(K.beam, 2), x0 - 1, yt - 1, x1 + 1, yt - 1);
  R(c, K.wood, x0, ym + 1, x1, yb, P.plankV(x0, 2)); c.line(K.beam, x0, ym + 1, x1, yb); c.line(K.beam, x1, ym + 1, x0, yb);
  if (beastId) { c.rect('bld_hole', x0, yt, x1, ym); beast(c, beastId, x0 + (w >> 1), yt + 1, f); }
  else { R(c, K.wood, x0, yt, x1, ym, P.plankV(x0, 2)); c.line(K.beam, x0, yt, x1, ym); c.line(K.beam, x1, yt, x0, ym); }
  c.rect(T(K.beam, 2), x0 - 1, ym + 1, x1 + 1, ym + 1); c.px(K.metal, x1 - 1, ym + 3);
}
// Mostrador de puesto con mercancías
function counter(c, K, x0, x1, y) { R(c, K.wood, x0, y, x1, y + 4, P.plankH(y, 2)); c.rect(T(K.wood, 2), x0, y, x1, y); goods(c, x0 + 1, x1 - 1, y - 1); }

// ------------------------------------------------------------- kit: HUMANOS
// Piedra clara, entramado de madera y yeso, tejas del equipo, estandartes.
const HUM = {
  id: 'human', wood: 'wood', beam: 'darkwood', stone: 'stone', metal: 'iron', blade: 'blade', horse: 'bld_horse',
  timber(c, x0, y0, x1, y1, st = 9) {
    c.rect('plaster', x0, y0, x1, y1);
    c.rect('darkwood', x0, y0, x1, y0); c.rect('darkwood', x0, y1, x1, y1);
    const n = Math.max(1, Math.round((x1 - x0) / st)), xs = [];
    for (let i = 0; i <= n; i++) xs.push(Math.round(x0 + (x1 - x0) * i / n));
    xs.forEach(x => c.rect('darkwood', x, y0, x, y1));
    if (y1 - y0 > 4) { c.line('darkwood', xs[0], y1, xs[1], y0); c.line('darkwood', xs[n], y1, xs[n - 1], y0); }
  },
  stonewall(c, x0, y0, x1, y1) { R(c, 'stone', x0, y0, x1, y1, P.brick(x0, y0, 5, 3)); },
  roof(c, xl, xr, yb, yt, o = {}) {
    const m = o.m || 'team', ins = o.ins ?? Math.round((yb - yt) * 0.45);
    xl = Math.max(xl, 1); xr = Math.min(xr, c.w - 2);
    trap(c, m, xl, xr, yb, yt, ins);
    tex(c, m, xl, yt, xr, yb, m === 'thatch' ? P.thatch(yb + 1) : P.tile(xl, yb + 1));
    if (xr - xl - 2 * ins > 0) c.rect(T(o.ridge || 'darkwood', 1), xl + ins, yt, xr - ins, yt);
    c.rect(T(m, 0), xl, yb, xr, yb);
  },
  door(c, cx, yb, w, h, o = {}) {
    const x0 = Math.round(cx - w / 2 + .01), x1 = x0 + w - 1, yt = yb - h + 1;
    c.rect('darkwood', x0 - 1, yt - 1, x1 + 1, yb);
    if (o.open) c.rect('bld_hole', x0, yt, x1, yb);
    else {
      R(c, 'wood', x0, yt, x1, yb, P.plankV(x0, 2));
      c.rect(T('iron', 1), x0, yt + 2, x1 - 1, yt + 2); c.rect(T('iron', 1), x0, yb - 2, x1 - 1, yb - 2); c.px('gold', x1 - 1, yt + (h >> 1) + 1);
    }
    if (w >= 4) { c.px('darkwood', x0, yt); c.px('darkwood', x1, yt); }
    return { x0, x1, yt };
  },
  win(c, x, y, w = 3, h = 4, o = {}) {
    c.rect('darkwood', x - 1, y - 1, x + w, y + h); c.rect('window', x, y, x + w - 1, y + h - 1);
    if (w >= 3) c.rect('darkwood', x + (w >> 1), y, x + (w >> 1), y + h - 1);
    c.rect(T('stone', 2), x - 1, y + h, x + w, y + h);
    if (o.sh) { c.rect(T('team', 1), x - 2, y - 1, x - 2, y + h - 1); c.rect(T('team', 0), x + w + 1, y - 1, x + w + 1, y + h - 1); }
  },
  chim(c, x, yt, yb, f, o = {}) {
    const w = o.w || 4;
    R(c, 'stone', x, yt, x + w - 1, yb, P.brick(x, yt, 4, 2, 0)); c.rect(T('stone', 2), x - 1, yt, x + w, yt); c.rect(T('stone', 0), x, yt + 1, x + w - 1, yt + 1);
    smoke(c, x + w / 2 - .5, yt - 1, f, o);
  },
  gable(c, xc, hw, gb, h, o = {}) {   // hastial frontal triangular con entramado y bordes de teja
    const gt = gb - h, rm = o.roof || 'team';
    c.poly('plaster', [[xc - hw, gb + 1], [xc + hw + 1, gb + 1], [xc + .5, gt + .5]]);
    c.line('darkwood', xc, gt + 2, xc, gb); c.rect('darkwood', xc - hw, gb, xc + hw, gb);
    for (let i = 0; i < 2; i++) { c.line(T(rm, 2), xc - hw - 1 + i, gb, xc, gt - 1 + i); c.line(T(rm, 0), xc + hw + 1 - i, gb, xc, gt - 1 + i); }
    c.px(T(rm, 3), xc, gt - 1);
    if (o.win) HUM.win(c, xc - 1, gb - 5, 3, 3);
  },
  // Cuerpo principal: muro (piedra abajo, entramado arriba) + tejado a cuatro aguas
  hall(c, x0, x1, yb, wh, rh, o = {}) {
    const wy = yb - wh + 1, f = o.f || 0, sh = o.sh ?? 3, cx = (x0 + x1) / 2;
    if (sh < wh) HUM.timber(c, x0, wy, x1, yb - sh, o.st || 9);
    HUM.stonewall(c, x0, Math.max(wy, yb - sh + 1), x1, yb);
    c.rect(T('darkwood', 0), x0, wy, x1, wy);
    HUM.roof(c, x0 - 2, x1 + 2, wy - 1, wy - rh, { m: o.roof, ins: o.ins });
    if (o.chim != null) HUM.chim(c, o.chim, wy - rh - 1, wy - Math.round(rh * 0.45), f);
    if (o.gable) HUM.gable(c, o.gable.x, o.gable.hw, wy - 1, o.gable.h, { win: o.gable.win, roof: o.roof });
    if (o.door !== false) HUM.door(c, o.door ?? cx, yb, o.dw || 5, o.dh || Math.min(wh - 2, 9), o);
    (o.wins || []).forEach(x => HUM.win(c, x, o.wy ?? wy + 3, o.ww || 3, o.whh || 4, { sh: o.shut }));
    return { wy, rt: wy - rh };
  },
  // Torre de piedra: cuerpo, cornisa, suelo de la plataforma y almenas (vista 3/4)
  tower(c, x0, x1, yb, yt, o = {}) {
    R(c, 'stone', x0, yt, x1, yb, P.brick(x0, yt, 5, 3));
    R(c, 'darkwood', x0, yt - 7, x1, yt - 4, P.plankH(yt - 7, 2));                // suelo visto desde arriba
    battl(c, T('stone', 2), x0, x1, yt - 7, 2, 2, 2);                              // almenas traseras
    R(c, 'stone', x0 - 1, yt - 3, x1 + 1, yt, P.brick(x0 - 1, yt - 3, 4, 2, 0));  // parapeto frontal
    c.rect(T('stone', 2), x0 - 1, yt - 3, x1 + 1, yt - 3);
    battl(c, 'stone', x0 - 1, x1 + 1, yt - 4, 2, 2, 2);
    for (let x = x0; x <= x1; x += 2) c.px(T('stone', 0), x, yt + 1);
    return yt - 5;
  },
  slit(c, x, y, h = 4) { c.rect('bld_hole', x, y, x, y + h - 1); c.px(T('stone', 2), x - 1, y - 1); c.px(T('stone', 2), x + 1, y - 1); },
  flag: (c, x, y, f, o) => flag(c, x, y, f, o),
  shedRoof: 'thatch', awnB: 'cloth',
  W: { face: 'stone', top: 'stone', ftex: (x, y) => P.brick(x, y, 5, 3), ttex: (x, y) => (xx, yy) => (md(yy - y, 3) === 2 ? 0 : null), merlon: 'stone' },
};

// ------------------------------------------------------------- muros y puertas (masks)
// Suelo de la tile en y 16..31. Caja central x4..11 / gy 20..26 y brazos hacia los vecinos
// (bits 1=N 2=E 4=S 8=O). Todo con tonos forzados para que las tiles empalmen sin costuras.
// W = { h, face, top, ff(x,y,fy,gb), tf(x,y,ty), crenH, crenV, post, deco, gate }
function wbox(c, W, x0, x1, gy0, gy1, H) {
  const ty = gy0 - H, fy = gy1 - H + 1;
  for (let y = ty; y <= gy1; y++) for (let x = x0; x <= x1; x++)
    { const v = y < fy ? W.tf(x, y, ty) : W.ff(x, y, fy, gy1); c.px(typeof v === 'string' ? v : T(y < fy ? W.top : W.face, v), x, y); }
  for (let x = x0; x <= x1; x++) c.glow(x, gy1 + 1, 60, '#140c28');
}

  // Dibuja en un lienzo auxiliar cuadrado y lo copia girado f×90° (giro horario)
  function spin(c, f, fn) {
    const t = new PE.SCanvas(c.w, c.h); fn(t);
    const n = c.w;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const m = t.g[y * n + x]; if (m === null) continue;
      let X = x, Y = y;
      for (let k = 0; k < (f & 3); k++) { const nx = n - 1 - Y; Y = X; X = nx; }
      c.px(m, X, Y);
    }
  }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeNoise(rnd, W, H, cell) {
  const gw = Math.ceil(W / cell) + 2, gh = Math.ceil(H / cell) + 2, g = new Float32Array(gw * gh);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const sm = t => t * t * (3 - 2 * t);
  return (x, y) => {
    const fx = x / cell, fy = y / cell, ix = Math.floor(fx), iy = Math.floor(fy), tx = sm(fx - ix), ty = sm(fy - iy);
    const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
    return a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty;

function worldStep(dt) {

  fireStep(dt);

  // reliquias
  for (const p of G.players) if (p.relics && p.alive) p.res.gold += p.relics * 0.5 * dt;
  if ((G.slowT = (G.slowT || 0) - dt) <= 0) {

        }

// --------------------------------------------------------------- clima
function weatherStep(dt) {
  const w = G.weather;
  w.a = Math.min(1, w.a + dt / 6);
  if (w.flash > 0) w.flash -= dt * 2.5;
  if (!G.cfg.weather) { w.cur = 'clear'; return; }
  if ((w.t -= dt) <= 0) {
    const cold = MAP_TYPES[G.cfg.mapType].cold || MAP_TYPES[G.cfg.mapType].snow;
    const weights = Object.entries(WEATHER).map(([k, v]) => [k, k === 'snow' ? (cold ? 30 : 4) : k === 'clear' ? v.w : v.w]);
    let r = Math.random() * weights.reduce((s, x) => s + x[1], 0), next = 'clear';
    for (const [k, wt] of weights) { r -= wt; if (r <= 0) { next = k; break; } }
    if (next !== w.cur) { w.prev = w.cur; w.cur = next; w.a = 0; if (G.time > 5) G.msg('El clima cambia: ' + WEATHER[next].n + (next === 'rain' || next === 'storm' ? ' (menor precisión a distancia)' : next === 'snow' ? ' (unidades más lentas)' : next === 'fog' ? ' (menos visión)' : ''), '#b8c8e8'); }
    w.t = next === 'clear' ? 150 + Math.random() * 150 : 70 + Math.random() * 90;
  }
  if (w.cur === 'storm' && (w.boltT = (w.boltT || 4) - dt) <= 0) {
    w.boltT = 5 + Math.random() * 10;
    const m = G.map; let x, y;
    if (Math.random() < 0.5 && G.cam) { x = G.cam.x + (Math.random() - 0.5) * 400; y = G.cam.y + (Math.random() - 0.5) * 260; } else { x = Math.random() * m.W * T; y = Math.random() * m.H * T; }
    x = clamp(x, 0, m.W * T - 1); y = clamp(y, 0, m.H * T - 1);
    w.flash = 1; w.bolt = { x, y, t: 0 }; addFx('fx_lightning', x, y - 20); sfx('thunder');
    sgEach(x, y, 20, u => { u.hp -= 25; if (u.hp <= 0) kill(u, null); });
    const r = G.map.res[tileOf(y) * m.W + tileOf(x)]; if (r && r.kind === 'tree' && Math.random() < 0.6) ignite(r);
    for (const b of G.blds) if (!b.dead && distRect(x, y, rectOf(b)) < 8 && !b.def.invuln) { b.hp -= 60; if (b.hp <= 0) kill(b, null); else if (Math.random() < 0.3) b.fire = 10; }
  }
}

// --------------------------------------------------------------- fuego
function ignite(r) { if (r.dead || r.burn) return; r.burn = 8 + Math.random() * 6; G.fires.add(r); }
function fireStep(dt) {
  if (!G.fires.size) return;
  const m = G.map, rain = G.weather.cur === 'rain' || G.weather.cur === 'storm' || G.weather.cur === 'snow';
  for (const r of [...G.fires]) {

    }

    if ((r.dmgT = (r.dmgT || 0) - dt) <= 0) {

      for (const b of G.blds) if (!b.dead && !b.def.invuln && distRect(c.x, c.y, rectOf(b)) < 10) { b.hp -= 10; if (!b.fire && Math.random() < 0.15) b.fire = 10; if (b.hp <= 0) kill(b, null); }

// --------------------------------------------------------------- desastres
function disaster() {

  const p = alive[Math.floor(Math.random() * alive.length)], s = G.map.starts[p.id];
  const kind = G.time > 900 && Math.random() < 0.3 ? 'invasion' : ['fire', 'quake', 'locust'][Math.floor(Math.random() * 3)];
  const near = { x: (s.x + (Math.random() - 0.5) * 30) * T, y: (s.y + (Math.random() - 0.5) * 30) * T };
  if (kind === 'fire') {
    let best = null, bd = 1e9; for (const r of G.resBy.tree || []) { if (r.dead) continue; const d = Math.hypot(r.tx * T - near.x, r.ty * T - near.y); if (d < bd) { bd = d; best = r; } }
    if (!best || G.weather.cur === 'rain') return;

  } else if (kind === 'quake') {
    const c = { x: s.x * T, y: s.y * T }; G.shake = 3.5; sfx('quake');
    for (const b of G.blds) if (!b.dead && !b.def.invuln && dist(centerOf(b), c) < 14 * T) { b.hp -= b.maxhp * (0.1 + Math.random() * 0.12); if (b.hp <= 0) kill(b, null); }
    sgEach(c.x, c.y, 14 * T, u => { u.stun = Math.max(u.stun, 1.2); });
    for (let k = 0; k < 10; k++) addFx('fx_dust', c.x + (Math.random() - 0.5) * 300, c.y + (Math.random() - 0.5) * 200);
    G.msg('¡Desastre! Un terremoto sacude ' + (p.id === G.human ? 'tu reino' : 'el territorio de ' + p.name), '#ff8a4a', { ping: c, sound: 'alert' });
  } else if (kind === 'invasion') {
    // una horda de monstruos aparece en el borde más cercano y marcha hacia el centro urbano
    const m = G.map, edges = [[2, s.y], [m.W - 3, s.y], [s.x, 2], [s.x, m.H - 3]];
    edges.sort((a, b) => Math.hypot(a[0] - s.x, a[1] - s.y) - Math.hypot(b[0] - s.x, b[1] - s.y));
    let [ex, ey] = edges[0];

    const tc = G.blds.find(b => !b.dead && b.team === p.id && b.type === 'tc'), goal = tc ? centerOf(tc) : { x: s.x * T, y: s.y * T };

const MUSIC = { nextT: 0, step: 0, mode: 'peace', bar: 0, timer: null, gain: null, song: null };
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
function makeSong(seed, battle) {
  const r = mulberry32(seed), scale = [0, 2, 3, 5, 7, 9, 10]; // dórico
  const root = battle ? 50 : 50;            // re
  const prog = battle ? [0, 6, 5, 6, 0, 3, 5, 4] : [0, 6, 3, 0, 5, 3, 6, 0];   // grados de acordes

}

// --------------------------------------------------------------- bucle

}
